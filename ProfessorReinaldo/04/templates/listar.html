<h1>Lista de Produtos</h1>

<table border="1">
<tr>
  <th>ID</th>
  <th>Descrição</th>
  <th>Compra</th>
  <th>Venda</th>
  <th>Data</th>
  <th>Ações</th>
</tr>

{% for p in regs %}
<tr>
  <td>{{ p[0] }}</td>
  <td>{{ p[1] }}</td>
  <td>{{ p[2] }}</td>
  <td>{{ p[3] }}</td>
  <td>{{ p[4] }}</td>
  <td>
    <a href="/produtos/editar/{{ p[0] }}">Editar</a> |
    <a href="/produtos/excluir/{{ p[0] }}">Excluir</a>
  </td>
</tr>
{% endfor %}
</table>

<br>
<a href="/produtos/cadastrar">Cadastrar Novo</a>
